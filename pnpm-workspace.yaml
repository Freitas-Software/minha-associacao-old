packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@biomejs/biome": 2.5.3
  "@types/node": 26.1.1
  "@vitest/coverage-v8": 4.1.10
  better-auth: 1.6.23
  tsx: 4.23.0
  typescript: 6.0.3
  vitest: 4.1.10
  zod: 4.4.3

catalogs:
  expo:
    "@types/react": ~19.2.2
    react: 19.2.3
    react-dom: 19.2.3
  web:
    "@types/react": ^19.2.0
    "@types/react-dom": ^19.2.0
    react: ^19.2.0
    react-dom: ^19.2.0

allowBuilds:
  esbuild: true
  unrs-resolver: true

catalogMode: prefer
cleanupUnusedCatalogs: true
disallowWorkspaceCycles: true
engineStrict: true
failIfNoMatch: true
strictDepBuilds: true
strictPeerDependencies: true

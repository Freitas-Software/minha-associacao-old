name: minha-associacao

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-minha_associacao}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-minha_associacao}"
      POSTGRES_USER: "${POSTGRES_USER:-minha_associacao}"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-minha_associacao}:${POSTGRES_PASSWORD:-minha_associacao}@postgres:5432/${POSTGRES_DB:-minha_associacao}"
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + process.env.PORT + '/api/health')
          .then(response => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8080}"
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    init: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:' + process.env.PORT + '/')
          .then(response => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:

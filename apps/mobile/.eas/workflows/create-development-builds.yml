name: Create development builds

defaults:
  tools:
    node: 24.18.0
    pnpm: 11.12.0
    corepack: true

on:
  workflow_dispatch: {}

jobs:
  validate:
    type: custom
    environment: development
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Validate mobile project
        working_directory: ../..
        run: |
          pnpm turbo run build --filter=@minha-associacao/mobile^...
          pnpm --filter @minha-associacao/mobile lint
          pnpm --filter @minha-associacao/mobile typecheck
          pnpm --filter @minha-associacao/mobile test
          pnpm --filter @minha-associacao/mobile expo:check

  build_android:
    needs: [validate]
    type: build
    params:
      platform: android
      profile: development

  build_ios:
    needs: [validate]
    type: build
    params:
      platform: ios
      profile: development
